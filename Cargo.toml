[package]
name = "shipforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A TUI-first deployment tool"
license = "MIT"

[dependencies]
atomic-write-file = "0.3.1"
async-trait = "0.1.92"
crossterm = { version = "0.29.0", features = ["osc52"] }
command-group = { version = "5.0.1", features = ["with-tokio"] }
flate2 = "1.1.10"
ratatui = "0.30.2"
russh = { version = "0.63.1", default-features = false, features = ["flate2", "ring"] }
russh-sftp = "2.4.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
thiserror = "2.0.20"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
time = "0.3.55"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.19"
toml = "1.1.5"
uuid = { version = "1.26.0", features = ["serde", "v7"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
portable-pty = "0.9.0"
rand = "0.10.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
