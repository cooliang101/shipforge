name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - name: Check disposable fixture cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/run-linux-acceptance-cleanup-tests.ps1
      - name: Check systemd runner cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/run-systemd-acceptance-cleanup-tests.ps1
      - name: Check systemd fixture safety
        if: runner.os == 'Linux'
        run: python3 -B tests/fixtures/systemd/test_fixture.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
